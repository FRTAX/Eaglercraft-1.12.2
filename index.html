<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft 1.12.2</title>
</head>
<body>
    <h1>Loading Eaglercraft...</h1> <!-- Placeholder while loading -->

    <script>
        // Path to your .wasm file (check file location)
        const wasmFile = "Eaglercraft_1.12.2.wasm"; // Update the path if needed

        // Function to load WASM
        function loadWASM() {
            console.log("Attempting to load WASM file from: " + wasmFile); // Debugging message

            fetch(wasmFile)
                .then(response => {
                    if (!response.ok) {
                        console.error("Failed to fetch the WASM file. Status: " + response.status); // Debugging message
                        throw new Error("Failed to fetch the WASM file");
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => WebAssembly.instantiate(buffer))
                .then(wasmModule => {
                    console.log("WASM loaded successfully!");
                    // Game setup code can go here
                    document.body.innerHTML = "<h1>Game Loaded!</h1>";
                })
                .catch(err => {
                    console.error("Error loading WASM:", err);
                    document.body.innerHTML = "<h1>Failed to load the game</h1>";
                });
        }

        // Load the WASM file on page load
        loadWASM();
    </script>
</body>
</html>
